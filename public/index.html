<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Rounds</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:auto;font-family:system-ui,sans-serif;background:#0d0f14;color:#eef0f5;padding:16px;max-width:720px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid #2a2f3a;background:#151925;color:#aab;text-align:center;cursor:pointer;font-weight:600}
.tab.on{background:#ff4655;color:#fff;border-color:#ff4655}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:10px;border-radius:10px;border:1px solid #2a2f3a;background:#151925;color:#eef0f5;font-size:14px}
button{padding:10px 14px;border-radius:10px;border:0;background:#2b3245;color:#fff;font-weight:600;cursor:pointer}
.card{background:#151925;border:1px solid #232a3a;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.sc{font-size:26px;font-weight:800;color:#ff4655;min-width:58px;text-align:center}
.sc small{display:block;font-size:10px;color:#889;font-weight:500}
.t{font-weight:700}.m{font-size:12px;color:#99a;margin-top:2px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#2b3245}
.tag.hot{background:#ff4655}
.note{color:#99a;font-size:13px;padding:14px;text-align:center}
a{color:#7fb2ff}
.err{color:#ffb84d;font-size:12px;margin-bottom:8px}
</style></head><body>
<h1>Meilleurs moments pro</h1>
<div class="tabs">
<div class="tab on" data-g="valorant">Valorant</div>
<div class="tab" data-g="cs2">CS2</div>
<div class="tab" data-g="rl">RL</div>
</div>
<div class="row"><input id="ids" placeholder="Liens ou IDs de matchs VLR (optionnel)"><button id="go">OK</button></div>
<div id="st" class="note"></div>
<div id="out"></div>
<script>
var game="valorant",timer=null;
var ids=document.getElementById("ids"),out=document.getElementById("out"),st=document.getElementById("st");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function safe(u){return /^https?:\/\//.test(u||"")?u:"#"}
function load(){
  clearTimeout(timer);
  var u="/api/clips?game="+game+"&limit=40"+(ids.value?"&ids="+encodeURIComponent(ids.value):"");
  fetch(u).then(function(r){return r.json()}).then(function(d){
    var p=d.progress||{},h="";
    st.textContent=(p.running||p.queued)?("Analyse en cours… "+(p.analysed||0)+" matchs analysés, "+(p.queued||0)+" en attente (limite 30 req/min)"):((p.analysed||0)+" matchs joués analysés"+(p.stats?" ("+p.stats.withPerf+" avec stats détaillées, "+p.stats.noPerf+" stats de map seulement, "+p.stats.skipped+" pas encore joués ignorés)":""));
    if(d.error)h+='<div class="err">'+esc(d.error)+"</div>";
    if(p.errors&&p.errors.length)h+='<div class="err">'+p.errors.map(esc).join("<br>")+"</div>";
    if(d.pending&&d.pending.length)h+='<div class="note">'+d.pending.join(", ").toUpperCase()+" : en attente de l'API GRID.</div>";
    if(!(d.clips||[]).length&&p.empty&&p.empty.length)h+='<div class="note">Matchs sans moment : '+p.empty.map(function(i){return '<a href="/api/clips/debug?id='+Number(i)+'" target="_blank">'+Number(i)+"</a>"}).join(", ")+"</div>";
    var clips=d.clips||[];
    if(!clips.length&&!(d.pending&&d.pending.length))h+='<div class="note">'+((p.running||p.queued)?"Rien pour l'instant, ça arrive…":"Aucun moment trouvé.")+"</div>";
    clips.forEach(function(c){
      h+='<div class="card"><div class="sc">'+c.score+"<small>score</small></div><div><div class=\"t\">"+esc(c.player)+(c.team?" ("+esc(c.team)+")":"")+'</div><div class="m">'+esc((c.teams||[]).join(" vs "))+" · "+esc(c.event||"")+(c.date?" · "+esc(String(c.date).slice(0,10)):"")+'</div><div class="tags">'+c.tags.map(function(t){return '<span class="tag'+(/ACE|CLUTCH 1v[345]/.test(t)?" hot":"")+'">'+esc(t)+"</span>"}).join("")+'</div><div class="m"><a href="'+esc(safe(c.url))+'" target="_blank" rel="noopener">VLR</a>'+(c.vod?' · <a href="'+esc(safe(c.vod))+'" target="_blank" rel="noopener">VOD</a>':"")+"</div></div></div>";
    });
    out.innerHTML=h;
    if(p.running||p.queued)timer=setTimeout(load,8000);
  }).catch(function(e){out.innerHTML='<div class="err">'+esc(e.message)+"</div>"});
}
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
  t.classList.add("on");game=t.dataset.g;load();}});
document.getElementById("go").onclick=load;
load();
</script></body></html>
